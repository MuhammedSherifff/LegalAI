[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legalai"
version = "0.1.0"
description = "Agentic RAG over the Egyptian Civil Code"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5",
    "langchain-core>=1.0",
    "langchain-groq>=1.0",
    "langchain-google-genai>=4.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "numpy>=2.0",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2",
    "sentence-transformers>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyarrow>=16"]
extract = ["pymupdf>=1.24"]

[project.scripts]
legalai = "legal_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["legal_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
